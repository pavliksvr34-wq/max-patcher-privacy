name: Build PAX 26.32.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_pax_26_32_1.yml'
      - 'scripts/patch_pax_26_32_1.py'
      - 'scripts/apply_pax_branding.py'
      - 'patches/**'
      - 'PAX.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download and validate original APKM
        env:
          SOURCE_URL: ${{ secrets.PAX_SOURCE_URL }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_URL"
          python - <<'PY'
          import os, urllib.parse, urllib.request
          u = os.environ["SOURCE_URL"]
          p = urllib.parse.urlsplit(u)
          q = urllib.parse.parse_qs(p.query)
          q["dl"] = ["1"]
          u = urllib.parse.urlunsplit((p.scheme,p.netloc,p.path,urllib.parse.urlencode(q,doseq=True),p.fragment))
          req = urllib.request.Request(u, headers={"User-Agent":"PAX-build/1.0"})
          with urllib.request.urlopen(req, timeout=90) as r, open("source.apkm","wb") as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          PY
          python - <<'PY'
          import zipfile, json
          z=zipfile.ZipFile("source.apkm")
          names=z.namelist()
          assert "base.apk" in names, names
          info=json.loads(z.read("info.json"))
          assert info.get("pname")=="ru.oneme.app", info
          assert str(info.get("versioncode"))=="6831", info
          assert info.get("release_version")=="26.32.1", info
          z.extractall("source")
          apks=[n for n in names if n.endswith(".apk")]
          print("Validated MAX 26.32.1 / 6831; APK entries:", apks)
          PY

      - name: Set up Java and Android tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Add build tools to PATH
        run: echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Apktool
        run: |
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          printf '#!/bin/sh\nexec java -jar "$GITHUB_WORKSPACE/apktool.jar" "$@"\n' > apktool
          chmod +x apktool
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Decode base APK
        run: apktool d source/base.apk -f -o apk_workdir

      - name: Inspect JNI and SMS fingerprint path (read-only)
        run: python scripts/inspect_jni_sms_26_32_1.py

      - name: Upload JNI/SMS inspection report
        uses: actions/upload-artifact@v4
        with:
          name: JNI-SMS-26.32.1-inspection
          path: |\n            jni-sms-report.txt\n            jni-sms-target-classes.txt
          if-no-files-found: error
          retention-days: 14

      - name: Apply strict PAX privacy patch
        run: python scripts/patch_pax_26_32_1.py

      - name: Apply PAX branding
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply_pax_branding.py

      - name: Restore stripped Material attribute for resource linking
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("apk_workdir/res/values")
          root.mkdir(parents=True, exist_ok=True)
          files = list(root.glob("*.xml"))
          if not any('name="state_dragged"' in p.read_text(errors="ignore") for p in files):
              (root / "pax_missing_attrs.xml").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <attr name="state_dragged" format="boolean" />\n'
                  '</resources>\n',
                  encoding="utf-8"
              )
              print("Restored missing state_dragged attribute declaration")
          else:
              print("state_dragged declaration already present")
          PY

      - name: Rebuild base APK
        run: |
          apktool b apk_workdir -o base-rebuilt-unsigned.apk
          zipalign -f -v 4 base-rebuilt-unsigned.apk base-rebuilt-aligned.apk

      - name: Prepare PAX signing key
        env:
          PAX_SIGNING_KEY_PK8_B64: ${{ secrets.PAX_SIGNING_KEY_PK8_B64 }}
          PAX_SIGNING_CERT_PEM_B64: ${{ secrets.PAX_SIGNING_CERT_PEM_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$PAX_SIGNING_KEY_PK8_B64" ] && [ -n "$PAX_SIGNING_CERT_PEM_B64" ]; then
            printf '%s' "$PAX_SIGNING_KEY_PK8_B64" | base64 --decode > pax-release.pk8
            printf '%s' "$PAX_SIGNING_CERT_PEM_B64" | base64 --decode > pax-release-cert.pem
            echo "PAX_SIGNING_MODE=persistent" >> "$GITHUB_ENV"
            echo "Using persistent PAX signing certificate"
          else
            keytool -genkeypair -v -keystore pax-test.keystore -alias pax -keyalg RSA -keysize 2048 -validity 10000 -storepass pax-temporary -keypass pax-temporary -dname "CN=PAX Test, OU=Build, O=PAX, L=Unknown, ST=Unknown, C=RU"
            echo "PAX_SIGNING_MODE=temporary" >> "$GITHUB_ENV"
            echo "WARNING: using a temporary test signing key"
          fi

      - name: Sign all APK splits with the same key
        run: |
          set -euo pipefail
          mkdir -p output
          cp source/info.json output/info.json
          cp base-rebuilt-aligned.apk output/base.apk
          for f in source/*.apk; do
            [ "$(basename "$f")" = "base.apk" ] && continue
            cp "$f" "output/$(basename "$f")"
          done
          for f in output/*.apk; do
            if [ "$PAX_SIGNING_MODE" = "persistent" ]; then
              apksigner sign --key pax-release.pk8 --cert pax-release-cert.pem "$f"
            else
              apksigner sign --ks pax-test.keystore --ks-key-alias pax --ks-pass pass:pax-temporary --key-pass pass:pax-temporary "$f"
            fi
            apksigner verify --verbose "$f"
          done
          zip -9 -j PAX-26.32.1-6831.apkm output/*

      - name: Verify APKM package and signatures
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile, json
          z=zipfile.ZipFile("PAX-26.32.1-6831.apkm")
          info=json.loads(z.read("info.json"))
          assert info["pname"]=="ru.oneme.app" and str(info["versioncode"])=="6831"
          apks=[n for n in z.namelist() if n.endswith(".apk")]
          assert "base.apk" in apks and len(apks)>=2, apks
          print("Final APKM entries:", apks)
          print("Metadata:", info["apk_title"])
          PY
          mkdir -p verify-apks
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("PAX-26.32.1-6831.apkm") as z:
              for name in z.namelist():
                  if name.endswith(".apk"):
                      z.extract(name, "verify-apks")
          PY
          reference_cert=""
          for apk in verify-apks/*.apk; do
            echo "===== VERIFY $(basename "$apk") ====="
            apksigner verify --verbose "$apk"
            cert="$(apksigner verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            test -n "$cert"
            if [ -z "$reference_cert" ]; then
              reference_cert="$cert"
            elif [ "$cert" != "$reference_cert" ]; then
              echo "FAIL: APK split signing certificates differ"
              exit 1
            fi
          done
          echo "PASS: all APK splits have the same signer certificate: $reference_cert"
          aapt dump badging verify-apks/base.apk | grep -E '^(package:|sdkVersion:|targetSdkVersion:)'
          sha256sum PAX-26.32.1-6831.apkm

      - name: Upload PAX test build
        uses: actions/upload-artifact@v4
        with:
          name: PAX-26.32.1-6831-test
          path: PAX-26.32.1-6831.apkm
          if-no-files-found: error
          retention-days: 30
