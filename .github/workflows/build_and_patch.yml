name: Build Patched APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download Apktool
      run: |
        wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
        sudo mv apktool.jar /usr/local/bin/apktool.jar
        echo '#!/bin/bash' | sudo tee /usr/local/bin/apktool
        echo 'java -jar /usr/local/bin/apktool.jar "$@"' | sudo tee -a /usr/local/bin/apktool
        sudo chmod +x /usr/local/bin/apktool

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools build-tools;34.0.0'

    # setup-android action doesnt add buildtools to the PATH, so we do manually
    - name: Add Android Build Tools to PATH
      run: echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH
      shell: bash

    - name: Decompile APK
      run: apktool d source_apk/ru.oneme.app.apk -f -o apk_workdir

    - name: Run Python Patcher
      run: python scripts/patcher.py

    - name: Apply PAX branding
      run: |
        python -m pip install --user Pillow
        python scripts/apply_pax_branding.py

    # prevents java.util.zip.ZipException: duplicate entry: stamp-cert-sha256
    - name: Remove original signature
      run: |
        rm -rf apk_workdir/original/META-INF
        rm -rf apk_workdir/original/stamp-cert-sha256

    - name: Rebuild APK
      run: apktool b apk_workdir -o rebuilt_unsigned.apk

    - name: Zipalign the APK
      run: zipalign -v 4 rebuilt_unsigned.apk rebuilt_aligned.apk

    - name: gen signing key
      run: |
        keytool -genkey -v \
          -keystore temp-release-key.keystore \
          -alias temp_alias \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass temppassword \
          -keypass temppassword \
          -dname "CN=Anonymous, OU=Anonymous, O=Anonymous, L=Unknown, ST=Unknown, C=XX"

    - name: sign the APK with key
      run: |
        apksigner sign --ks temp-release-key.keystore \
        --ks-key-alias temp_alias \
        --ks-pass pass:temppassword \
        --key-pass pass:temppassword \
        rebuilt_aligned.apk

    - name: Final APK
      run: mv rebuilt_aligned.apk patched-app-release.apk

    - name: Diagnose APK compatibility
      run: |
        python - <<'PY'
        import zipfile
        from pathlib import Path

        files = {
            "SOURCE": Path("source_apk/ru.oneme.app.apk"),
            "REBUILT": Path("patched-app-release.apk"),
        }
        for label, path in files.items():
            print(f"\\n===== {label}: {path} ({path.stat().st_size} bytes) =====")
            with zipfile.ZipFile(path) as z:
                names = z.namelist()
                libs = [n for n in names if n.startswith("lib/") and n.endswith(".so")]
                print("Native library count:", len(libs))
                print("Native libraries:")
                for name in libs:
                    print(" ", name)
                print("DEX files:", sum(1 for n in names if n.endswith(".dex")))
                print("APK entries:", len(names))
        PY
        echo "===== SOURCE BADGING ====="
        aapt dump badging source_apk/ru.oneme.app.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|uses-feature:)"
        echo "===== REBUILT BADGING ====="
        aapt dump badging patched-app-release.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|uses-feature:)"
        echo "===== SOURCE REQUIRED FEATURES ====="
        aapt dump xmltree source_apk/ru.oneme.app.apk AndroidManifest.xml | grep -E -A 3 "E: uses-feature|glEsVersion|E: uses-sdk|minSdkVersion|targetSdkVersion"
        echo "===== REBUILT REQUIRED FEATURES ====="
        aapt dump xmltree patched-app-release.apk AndroidManifest.xml | grep -E -A 3 "E: uses-feature|glEsVersion|E: uses-sdk|minSdkVersion|targetSdkVersion"

    - name: Upload Patched APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: patched-apk
        path: patched-app-release.apk