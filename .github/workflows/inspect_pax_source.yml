name: Inspect MAX source for PAX

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect_pax_source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download MAX APKM from Dropbox
        env:
          PAX_SOURCE_URL: ${{ secrets.PAX_SOURCE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PAX_SOURCE_URL:-}" ]; then
            echo "::error::Repository secret PAX_SOURCE_URL is not configured"
            exit 1
          fi
          DOWNLOAD_URL="$(python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          value = os.environ["PAX_SOURCE_URL"]
          parts = urlsplit(value)
          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["dl"] = "1"
          print(urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), "")))
          PY
          )"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output MAX_26.32.1_6831.apkm "$DOWNLOAD_URL"
          test "$(stat -c%s MAX_26.32.1_6831.apkm)" -gt 30000000
          sha256sum MAX_26.32.1_6831.apkm

      - name: Validate APKM and inspect split metadata
        shell: bash
        run: |
          set -euo pipefail
          unzip -t MAX_26.32.1_6831.apkm
          mkdir apkm
          unzip -q MAX_26.32.1_6831.apkm -d apkm
          echo "===== APKM FILES ====="
          find apkm -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          echo "===== APKM INFO ====="
          if [ -f apkm/info.json ]; then cat apkm/info.json; else echo "::error::info.json missing"; exit 1; fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("apkm/info.json")
          data = json.loads(p.read_text())
          print("Parsed metadata:", json.dumps(data, ensure_ascii=False, indent=2))
          text = json.dumps(data).lower()
          if "ru.oneme.app" not in text or "6831" not in text:
              raise SystemExit("APKM metadata does not identify ru.oneme.app versionCode 6831")
          apks = sorted(Path("apkm").glob("*.apk"))
          if not apks:
              raise SystemExit("No APK files found inside APKM")
          print("APK count:", len(apks))
          PY
          for apk in apkm/*.apk; do
            echo "===== $apk ====="
            aapt dump badging "$apk" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' || true
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0'

      - name: Add Android build tools to PATH
        run: echo "${ANDROID_HOME}/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Install Apktool
        run: |
          curl --fail --location --retry 3 \
            https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar \
            --output apktool.jar
          printf '#!/usr/bin/env bash\nexec java -jar "$GITHUB_WORKSPACE/apktool.jar" "$@"\n' > apktool
          chmod +x apktool
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Decode base APK
        run: |
          set -euo pipefail
          BASE="$(find apkm -maxdepth 1 -name 'base.apk' -print -quit)"
          test -n "$BASE"
          apktool d "$BASE" -f -o apk_workdir

      - name: Check existing patch compatibility without modifying files
        run: |
          python - <<'PY'
          from pathlib import Path
          import glob

          smali_files = [Path(p) for p in glob.glob("apk_workdir/**/*.smali", recursive=True)]
          originals = sorted(Path("patches/original").glob("*.smali-snippet"))
          patched = {p.name for p in Path("patches/patched").glob("*.smali-snippet")}
          print(f"Smali files decoded: {len(smali_files)}")
          print(f"Original patch snippets: {len(originals)}")
          print(f"Patched snippets: {len(patched)}")
          missing_pairs = [p.name for p in originals if p.name not in patched]
          if missing_pairs:
              raise SystemExit("Patch pairs missing: " + ", ".join(missing_pairs))
          corpus = []
          for path in smali_files:
              try:
                  corpus.append((path, path.read_text(encoding="utf-8")))
              except UnicodeDecodeError:
                  pass
          matched = []
          unmatched = []
          for patch in originals:
              snippet = patch.read_text(encoding="utf-8")
              hits = [(p, text.count(snippet)) for p, text in corpus if snippet in text]
              count = sum(n for _, n in hits)
              (matched if count else unmatched).append((patch.name, count, [p.as_posix() for p, n in hits]))
          print("\n===== PATCH MATCH REPORT =====")
          for name, count, paths in matched:
              print(f"MATCH {count:>3}  {name}  {', '.join(paths[:3])}")
          for name, count, _ in unmatched:
              print(f"NO MATCH      {name}")
          print(f"\nMatched snippets: {len(matched)}/{len(originals)}")
          print(f"Unmatched snippets: {len(unmatched)}")
          if not matched:
              raise SystemExit("No existing patches match this MAX version")
          Path("patch_compatibility.txt").write_text(
              "\n".join([f"MATCH {n} {name}" for name, n, _ in matched] +
                         [f"NO MATCH {name}" for name, _, _ in unmatched]),
              encoding="utf-8")
          PY

      - name: Locate current analytics and tracker implementations
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("apk_workdir")
          patterns = re.compile(
              r"mytracker|my_tracker|callanalytics|analytics|telemetry|"
              r"trackevent|send.?data|user.?id|root.?check|app.?list",
              re.IGNORECASE
          )
          out = []
          files = list(root.rglob("*.smali")) if root.exists() else []
          for path in files:
              try:
                  lines = path.read_text(encoding="utf-8", errors="ignore").splitlines()
              except OSError:
                  continue
              hits = [(i, line.strip()) for i, line in enumerate(lines, 1) if patterns.search(line)]
              if hits:
                  out.append(f"\\n### {path.as_posix()}")
                  out.extend(f"{i}: {line[:300]}" for i, line in hits[:80])
          report = "\\n".join(out[:2500])
          Path("source_symbol_report.txt").write_text(
              f"Decoded smali files: {len(files)}\\n" + report,
              encoding="utf-8"
          )
          print(f"Scanned {len(files)} smali files; wrote {len(out)} matching sections")
          PY

      - name: Extract MyTracker initialization and network boundaries
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("apk_workdir")
          out = []
          targets = ["d6.smali", "rel.smali", "ctb.smali", "pal.smali", "ssb.smali"]
          for name in targets:
              matches = list(root.rglob(name))
              for path in matches:
                  lines = path.read_text(encoding="utf-8", errors="ignore").splitlines()
                  out.append(f"\\n===== {path.as_posix()} =====")
                  for i, line in enumerate(lines):
                      if line.startswith(".method "):
                          end = i + 1
                          while end < len(lines) and not lines[end].startswith(".end method"):
                              end += 1
                          block = lines[i:min(end + 1, len(lines))]
                          joined = "\\n".join(block)
                          if re.search(r"MyTracker|tracker-api|trackLogin|trackRegistration|initTracker|InstanceId|Attribution", joined, re.I):
                              out.append("\\n".join(f"{j+1}: {x}" for j, x in enumerate(block, i)))
          endpoints = []
          for path in root.rglob("*.smali"):
              try: lines = path.read_text(encoding="utf-8", errors="ignore").splitlines()
              except OSError: continue
              for i, line in enumerate(lines):
                  if re.search(r"https?://|wss?://", line, re.I):
                      if re.search(r"tracker|analytics|telemetry|metric|stat", line, re.I):
                          endpoints.append(f"{path.as_posix()}:{i+1}: {line.strip()[:350]}")
          out.append("\\n===== TRACKER / ANALYTICS ENDPOINT STRINGS =====")
          out.extend(endpoints)
          Path("mytracker_boundary_report.txt").write_text("\\n".join(out), encoding="utf-8")
          print(f"Extracted {len(out)} report sections/lines")
          PY

      - name: Collect focused MyTracker source files
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path("apk_workdir")
          out = Path("tracker_source")
          out.mkdir(exist_ok=True)
          names = ["nsb.smali", "rel.smali", "ssb.smali", "kxl.smali", "pal.smali", "ctb.smali", "d6.smali"]
          copied = []
          for name in names:
              for src in root.rglob(name):
                  dst = out / (str(len(copied)) + "_" + name)
                  shutil.copy2(src, dst)
                  copied.append((src, dst))
          # Capture all application call sites into MyTracker, not only SDK classes.
          calls = out / "mytracker_callsites.txt"
          with calls.open("w") as f:
              for src in root.rglob("*.smali"):
                  try: lines = src.read_text(encoding="utf-8", errors="ignore").splitlines()
                  except OSError: continue
                  for i, line in enumerate(lines):
                      if "Lcom/my/tracker/MyTracker;->" in line or "Lcom/my/tracker/MyTrackerConfig;->" in line:
                          lo, hi = max(0, i-5), min(len(lines), i+7)
                          f.write(f"\\n===== {src}:{i+1} =====\\n")
                          f.write("\\n".join(f"{j+1}: {lines[j]}" for j in range(lo, hi)) + "\\n")
          pkg = root / "smali" / "com" / "my" / "tracker"
          if pkg.exists():
              shutil.copytree(pkg, out / "com_my_tracker", dirs_exist_ok=True)
          with (out / "INDEX.txt").open("w") as f:
              for src, dst in copied:
                  f.write(f"{src} -> {dst}\\n")
              f.write(f"Tracker package present: {pkg.exists()}\\n")
          print((out / "INDEX.txt").read_text())
          PY

      - name: Collect privacy-sensitive implementation methods
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          root = Path("apk_workdir")
          out = Path("privacy_methods")
          out.mkdir(exist_ok=True)
          targets = {"bu5.smali","ygk.smali","xs.smali","x18.smali","zsl.smali","gkl.smali","mjl.smali","rjl.smali","otj.smali","ju5.smali","q77.smali","r77.smali","s77.smali","ao5.smali","hsl.smali","h2j.smali","rgl.smali","val.smali","y18.smali","w18.smali","x8l.smali","d8k.smali","qji.smali","ktf.smali","dql.smali","xtb.smali","fpm.smali","gam.smali","ptm.smali","eii.smali","tnb.smali","wzf.smali","esl.smali","ad8.smali","nul.smali","h88.smali","Analytics.smali","AnalyticsEventEnricher.smali","FcmAnalyticsDao.smali"}
          copied = []
          for src in root.rglob("*.smali"):
              if src.name in targets:
                  dst = out / (str(len(copied)) + "_" + src.name)
                  shutil.copy2(src, dst)
                  copied.append(f"{src} -> {dst}")
          with (out / "callers.txt").open("w") as f:
              rx = re.compile(r"AdvertisingIdClient|AppSetIdClient|FirebaseInstallations|FirebaseAnalytics|Analytics|trackEvent|getInstalledPackages|RootBeer|isRooted|Lbu5;|Lygk;|Lx18;|Ly18;|Ldql;|Lxtb;|Lfpm;|Lgam;|Lptm;|Lesl;|Lad8;|Lh88;|MyTracker;->getInstanceId", re.I)
              for src in root.rglob("*.smali"):
                  try: lines = src.read_text(errors="ignore").splitlines()
                  except OSError: continue
                  for i, line in enumerate(lines):
                      if rx.search(line):
                          lo, hi = max(0, i-8), min(len(lines), i+12)
                          f.write(f"\\n===== {src}:{i+1} =====\\n")
                          f.write("\\n".join(f"{j+1}: {lines[j]}" for j in range(lo, hi)) + "\\n")
          # Include selected app telemetry and tracer implementations.
          for rel in ["ru/ok/tracer", "ru/trace_flow"]:
              src = root / "smali" / rel
              if src.exists():
                  dst = out / rel.replace("/", "_")
                  shutil.copytree(src, dst, dirs_exist_ok=True)
                  copied.append(f"{src} -> {dst}/")
          named = {"DailyAnalyticsWorker.smali","Analytics.smali","LogController.smali",
                   "AuthEventStats.smali","CallsNotificationsTracker.smali","PromotedStats.smali",
                   "OrganizationStats.smali","FcmAnalyticsDao.smali","CallSdkAnalyticsDelegate.smali",
                   "FakePixelStats.smali"}
          for src in root.rglob("*.smali"):
              if src.name in named:
                  dst = out / ("named_" + str(len(copied)) + "_" + src.name)
                  shutil.copy2(src, dst)
                  copied.append(f"{src} -> {dst}")
          (out / "INDEX.txt").write_text("\\n".join(copied), encoding="utf-8")
          print(f"Copied {len(copied)} focused privacy implementation classes")
          PY

      - name: Build full privacy inventory
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("apk_workdir")
          out = []
          manifest = root / "AndroidManifest.xml"
          if manifest.exists():
              text = manifest.read_text(errors="ignore")
              out.append("===== MANIFEST PERMISSIONS / COMPONENTS =====")
              for line in text.splitlines():
                  if re.search(r"<uses-permission|<permission|<uses-feature|<service|<receiver|<provider|<activity|<application|android:exported|android:foregroundServiceType", line):
                      out.append(line.strip())
          patterns = {
            "SENSITIVE_ANDROID_APIS": r"getInstalledPackages|getInstalledApplications|QUERY_ALL_PACKAGES|PackageManager;->getPackage|AdvertisingIdClient|AppSetId|Settings\\$Secure|ANDROID_ID|TelephonyManager|Build\\$(DEVICE|MODEL|MANUFACTURER|FINGERPRINT)|getImei|getDeviceId|getSubscriberId|getSimSerialNumber|LocationManager|FusedLocationProvider|MediaProjection|UsageStatsManager|ClipboardManager|ContactsContract|AccountManager|WifiInfo|getBSSID|getMacAddress|BluetoothAdapter",
            "ANALYTICS_AND_TRACKERS": r"MyTracker|mytracker|vk-analytics|apptracer|AppsFlyer|appsflyer|FirebaseAnalytics|FirebaseInstallations|AppMeasurement|AdjustSdk|Adjust;->|Amplitude|Mixpanel|Flurry|Branch;->|FacebookSdk|AppEventsLogger|Sentry|Datadog|Telemetry|Analytics",
            "NETWORK_ENDPOINTS": r"https?://[^\\s\"'<>]+|wss?://[^\\s\"'<>]+",
            "ANALYTICS_EVENT_STRINGS": r"(?i)analytics|telemetry|tracking|trackevent|event_name|session_start|session_end|app_open|app_close|install_referrer|attribution|advertising.?id"
          }
          files = list(root.rglob("*.smali")) if root.exists() else []
          for section, pattern in patterns.items():
              rx = re.compile(pattern)
              out.append("\\n===== " + section + " =====")
              seen = set()
              for path in files:
                  try: lines = path.read_text(errors="ignore").splitlines()
                  except OSError: continue
                  for i, line in enumerate(lines, 1):
                      if rx.search(line):
                          item = f"{path.relative_to(root)}:{i}: {line.strip()[:350]}"
                          if item not in seen:
                              seen.add(item)
                              out.append(item)
              out.append(f"TOTAL {section}: {len(seen)}")
          # Identify non-base libraries by package roots and class paths.
          out.append("\\n===== SDK / LIBRARY PACKAGE ROOTS =====")
          for p in sorted((root / "smali").rglob("*.smali")) if (root / "smali").exists() else []:
              rel = p.relative_to(root / "smali")
              parts = rel.parts
              if len(parts) >= 3 and parts[0] not in {"android", "androidx", "kotlin", "java", "javax", "com"}:
                  continue
              if len(parts) >= 3 and parts[0] == "com" and parts[1] not in {"my", "google", "android", "squareup", "facebook", "fasterxml", "airbnb"}:
                  continue
          from collections import Counter
          roots = Counter()
          for path in files:
              rel = path.relative_to(root / "smali") if str(path).startswith(str(root / "smali") + "/") else path.relative_to(root)
              parts = rel.parts
              if len(parts) >= 2 and parts[0] in {"com","org","io","ru","one","androidx","android","kotlin"}:
                  roots["/".join(parts[:min(3, len(parts)-1)])] += 1
          out.append("\\n===== PACKAGE ROOT CLASS COUNTS =====")
          out.extend(f"{name}: {count}" for name,count in roots.most_common())
          root_rx = re.compile(r"/system/(?:app|bin|xbin)/|/sbin/su|/su/bin|Superuser\\.apk|test-keys|magisk|supersu|busybox|ro\\.debuggable|ro\\.secure|RootBeer|isRooted|checkForSuBinary", re.I)
          out.append("\\n===== ROOT DETECTION INDICATORS =====")
          root_hits = []
          for path in files:
              try: lines = path.read_text(errors="ignore").splitlines()
              except OSError: continue
              for i,line in enumerate(lines,1):
                  if root_rx.search(line):
                      root_hits.append(f"{path.relative_to(root)}:{i}: {line.strip()[:300]}")
          out.extend(root_hits[:300])
          out.append(f"TOTAL ROOT DETECTION INDICATORS: {len(root_hits)}")
          Path("privacy_inventory.txt").write_text("\\n".join(out), encoding="utf-8")
          print(f"Privacy inventory written; decoded smali classes: {len(files)}; lines: {len(out)}")
          PY

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-source-inspection
          path: |
            patch_compatibility.txt
            source_symbol_report.txt
            mytracker_boundary_report.txt
            tracker_source/
            privacy_inventory.txt
            privacy_methods/
            apkm/info.json
            apk_workdir/AndroidManifest.xml
          if-no-files-found: warn
